name: Windows validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build and isolated regression
        shell: powershell
        run: ./scripts/Validate.ps1 -OutputRoot "$env:RUNNER_TEMP/omnivibe-validation"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-validation
          path: |
            ${{ runner.temp }}/omnivibe-validation/results.json
            ${{ runner.temp }}/omnivibe-validation/*-results.json
            ${{ runner.temp }}/omnivibe-validation/release-manifest.json
