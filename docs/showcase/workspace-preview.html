<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>OmniVibe 工作空间预览</title>
<style>
*{box-sizing:border-box}body{margin:0;width:1600px;height:860px;background:#111318;color:#eeedf3;font-family:"Segoe UI","Microsoft YaHei",sans-serif}.page{padding:32px}.header{display:flex;justify-content:space-between;align-items:center;margin:0 0 24px}.header strong{font-size:22px;font-weight:600}.header span{font-size:13px;color:#a6a6b6}.grid{display:grid;grid-template-columns:1040px 472px;gap:24px}.scene{position:relative;border:1px solid #43443f;border-radius:12px;overflow:hidden;height:650px;background:#171c1b}.terminal{display:block;width:1040px;height:650px}.wheel{position:absolute;right:12px;bottom:20px;width:316px;height:316px;border-radius:50%;background:radial-gradient(circle,#0e1616e8 0%,#0e1616b0 56%,transparent 72%)}.wheel img{width:316px;height:316px}.aside{display:flex;flex-direction:column;gap:20px}.core{display:flex;align-items:center;gap:24px;height:142px;background:#1c1d25;border:1px solid #363841;border-radius:12px;padding:15px 28px}.core img{width:108px;height:108px}.core h2{font-size:19px;font-weight:550;margin:0 0 10px}.core p{font-size:14px;color:#aaaeba;line-height:1.6;margin:0}.inventory{padding:15px;border:1px solid #363841;border-radius:12px;background:#1c1d25;flex:1}.inventory img{width:440px;height:330px;display:block}.inventory h2{font-size:19px;font-weight:550;margin:18px 4px 8px}.inventory p{font-size:14px;color:#aaaeba;margin:0 4px;line-height:1.6}.caption{display:flex;justify-content:space-between;font-size:14px;color:#b8b5c5;margin-top:20px}.foot{font-size:11px;color:#858896;margin-top:17px}

<div class="page">
 <div class="header"><strong>OmniVibe</strong><span>工作空间预览 · 墨玉机关主题</span></div>
 <div class="grid">
  <div class="scene"><img class="terminal" src="../terminal-frame-refinement/ink-jade-regular.png" alt="主题终端"><div class="wheel"><img src="../game-suite-refinement/screens/deck-ink-jade-decorated.png" alt="展开圆盘"></div></div>

  </div>
 </div>
 <div class="caption"><span>主题终端 + 悬停展开的任务圆盘</span><span>固定槽位 / 快捷键切换 / 状态总览</span></div>
